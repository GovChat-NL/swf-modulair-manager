# This file tells GovChat what the app is. It is the same for each organisation.
# The rules are in CONTRACT.md of the govchat command.
name: __NAME__
version: 0.1.0
contract: v2
title: "My app"                    # the name that a user sees. Letters, digits, spaces and hyphens only.
description: "One sentence that tells an administrator what the app does."
kern: ">=0.2.0 <1.0.0"             # the versions of the kern that the app operates with

# The container image of the MCP server. Use a fixed version, not "latest".
image: __NAME__:0.1.0
port: 8080
path: /mcp

# Optional parts. Remove the "#" to use them.
# egress: internet                 # the app can connect to the internet (port 443). Default: none.
# config:                          # settings that an organisation can give. They become environment variables.
#   API_URL: { required: true, description: "The address of the API." }
#   LANGUAGE: { default: "nl", description: "The language of the answers." }
# secrets: [API_KEY]               # keys of the Secret "__NAME__" in the cluster. Names only, no values.
